<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KasirKu Master - Inventory & POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        html, body { background-color: #0f172a; margin: 0; padding: 0; min-height: 100vh; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 480px; min-height: 100vh; background: #ffffff; position: relative; display: flex; flex-direction: column; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root" class="w-full flex justify-center"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const db = new Dexie('kasirku_master_v4');
        db.version(1).stores({
            menus: 'id, category',
            stocks: 'id',
            txs: 'id, createdAt',
            opex: 'id, createdAt',
            waste: 'id, createdAt'
        });

        const seedInitialData = async () => {
            const menuCount = await db.menus.count();
            if (menuCount > 0) return;

            await db.stocks.bulkAdd([
                { id: 'stk-1', name: 'Beras Premium', unit: 'kg', price: 14000, qty: 20 },
                { id: 'stk-2', name: 'Minyak Goreng', unit: 'L', price: 18000, qty: 15 },
                { id: 'stk-3', name: 'Daging Ayam', unit: 'kg', price: 38000, qty: 10 },
                { id: 'stk-4', name: 'Teh Celup', unit: 'pcs', price: 500, qty: 100 },
                { id: 'stk-5', name: 'Gula Pasir', unit: 'kg', price: 16000, qty: 10 },
                { id: 'stk-6', name: 'Susu UHT', unit: 'L', price: 20000, qty: 8 },
                { id: 'stk-7', name: 'Buah Mangga', unit: 'kg', price: 25000, qty: 5 }
            ]);

            await db.menus.bulkAdd([
                { 
                    id: 'm-1', 
                    name: 'Nasi Goreng Ayam', 
                    category: 'Makanan', 
                    price: 25000, 
                    icon: '🍳',
                    ingredients: [
                        { stockId: 'stk-1', qty: 0.15 },
                        { stockId: 'stk-2', qty: 0.02 },
                        { stockId: 'stk-3', qty: 0.08 }
                    ] 
                },
                { 
                    id: 'm-2', 
                    name: 'Ayam Goreng Crispy', 
                    category: 'Makanan', 
                    price: 22000, 
                    icon: '🍗',
                    ingredients: [
                        { stockId: 'stk-2', qty: 0.03 },
                        { stockId: 'stk-3', qty: 0.20 }
                    ] 
                },
                { 
                    id: 'm-3', 
                    name: 'Es Teh Manis', 
                    category: 'Minuman', 
                    price: 6000, 
                    icon: '🧊',
                    ingredients: [
                        { stockId: 'stk-4', qty: 1 },
                        { stockId: 'stk-5', qty: 0.02 }
                    ] 
                },
                { 
                    id: 'm-4', 
                    name: 'Es Latte Susu', 
                    category: 'Minuman', 
                    price: 18000, 
                    icon: '🧋',
                    ingredients: [
                        { stockId: 'stk-6', qty: 0.2 },
                        { stockId: 'stk-5', qty: 0.01 }
                    ] 
                },
                { 
                    id: 'm-5', 
                    name: 'Pudding Mangga', 
                    category: 'Dessert', 
                    price: 15000, 
                    icon: '🍮',
                    ingredients: [
                        { stockId: 'stk-7', qty: 0.1 },
                        { stockId: 'stk-5', qty: 0.02 }
                    ] 
                }
            ]);
        };

        function App() {
            const [tab, setTab] = useState('kasir');
            const [menus, setMenus] = useState([]);
            const [stocks, setStocks] = useState([]);
            const [txs, setTxs] = useState([]);
            const [opexList, setOpexList] = useState([]);
            const [wasteList, setWasteList] = useState([]);
            const [loading, setLoading] = useState(true);

            const [datePreset, setDatePreset] = useState('semua');
            const [cart, setCart] = useState([]);
            const [kasirCat, setKasirCat] = useState('Makanan');

            const [checkoutModal, setCheckoutModal] = useState(false);
            const [receiptModal, setReceiptModal] = useState(null);
            const [opexModal, setOpexModal] = useState(false);
            const [wasteModal, setWasteModal] = useState(false);
            const [menuModal, setMenuModal] = useState(false);
            const [bahanModal, setBahanModal] = useState(false);
            const [editingMenu, setEditingMenu] = useState(null);

            const [formOpex, setFormOpex] = useState({ category: 'Listrik', amount: '', note: '' });
            const [formWaste, setFormWaste] = useState({ stockId: '', qty: '', note: '' });
            const [formBahan, setFormBahan] = useState({ name: '', unit: 'kg', price: '', qty: '' });
            const [formMenu, setFormMenu] = useState({ name: '', category: 'Makanan', price: '', icon: '🍽️', ingredients: [{ stockId: '', qty: '' }] });

            const loadData = async () => {
                await seedInitialData();
                setMenus(await db.menus.toArray());
                setStocks(await db.stocks.toArray());
                setTxs(await db.txs.reverse().toArray());
                setOpexList(await db.opex.reverse().toArray());
                setWasteList(await db.waste.reverse().toArray());
                setLoading(false);
            };

            useEffect(() => { loadData(); }, []);

            const getMenuCOGS = (recipe) => {
                if (!recipe || !recipe.length) return 0;
                return recipe.reduce((acc, curr) => {
                    const stk = stocks.find(s => s.id === curr.stockId);
                    return acc + (stk ? stk.price * (parseFloat(curr.qty) || 0) : 0);
                }, 0);
            };

            const filteredTxs = useMemo(() => {
                const now = new Date();
                return txs.filter(t => {
                    const d = new Date(t.createdAt);
                    if (datePreset === 'hariIni') return d.toDateString() === now.toDateString();
                    if (datePreset === 'bulanIni') return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
                    return true;
                });
            }, [txs, datePreset]);

            const filteredOpex = useMemo(() => {
                const now = new Date();
                return opexList.filter(o => {
                    const d = new Date(o.createdAt);
                    if (datePreset === 'hariIni') return d.toDateString() === now.toDateString();
                    if (datePreset === 'bulanIni') return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
                    return true;
                });
            }, [opexList, datePreset]);

            const filteredWaste = useMemo(() => {
                const now = new Date();
                return wasteList.filter(w => {
                    const d = new Date(w.createdAt);
                    if (datePreset === 'hariIni') return d.toDateString() === now.toDateString();
                    if (datePreset === 'bulanIni') return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
                    return true;
                });
            }, [wasteList, datePreset]);

            const totalRevenue = useMemo(() => filteredTxs.reduce((a, b) => a + b.total, 0), [filteredTxs]);
            const totalCOGS = useMemo(() => filteredTxs.reduce((a, b) => a + (b.hppTotal || 0), 0), [filteredTxs]);
            const grossProfit = totalRevenue - totalCOGS;
            const totalOpex = useMemo(() => filteredOpex.reduce((a, b) => a + b.amount, 0), [filteredOpex]);
            const netProfit = grossProfit - totalOpex;

            const totalStockValue = useMemo(() => stocks.reduce((a, b) => a + (b.qty * b.price), 0), [stocks]);
            const totalItemsSold = useMemo(() => filteredTxs.reduce((acc, tx) => acc + tx.items.reduce((sum, item) => sum + item.qty, 0), 0), [filteredTxs]);
            const totalWasteCost = useMemo(() => filteredWaste.reduce((a, b) => a + b.estimatedLoss, 0), [filteredWaste]);

            const addToCart = (menu) => {
                setCart(prev => {
                    const exist = prev.find(c => c.id === menu.id);
                    if (exist) return prev.map(c => c.id === menu.id ? { ...c, qty: c.qty + 1 } : c);
                    return [...prev, { ...menu, qty: 1 }];
                });
            };

            const updateCartQty = (id, delta) => {
                setCart(prev => prev.map(c => {
                    if (c.id === id) {
                        const newQty = c.qty + delta;
                        return newQty > 0 ? { ...c, qty: newQty } : null;
                    }
                    return c;
                }).filter(Boolean));
            };

            const handleCheckout = async () => {
                if (!cart.length) return;

                // Verifikasi ketersediaan stok bahan gudang
                for (let item of cart) {
                    if (item.ingredients) {
                        for (let ing of item.ingredients) {
                            const stk = stocks.find(s => s.id === ing.stockId);
                            const requiredQty = ing.qty * item.qty;
                            if (!stk || stk.qty < requiredQty) {
                                alert(`Stok ${stk ? stk.name : 'Bahan'} di Gudang tidak cukup!\nButuh: ${requiredQty.toFixed(2)} ${stk?.unit || ''}\nSisa persediaan: ${stk?.qty.toFixed(2) || 0}`);
                                return;
                            }
                        }
                    }
                }

                // Pengurangan otomatis stok bahan baku di Gudang
                for (let item of cart) {
                    if (item.ingredients) {
                        for (let ing of item.ingredients) {
                            const stk = stocks.find(s => s.id === ing.stockId);
                            if (stk) {
                                const newQty = Math.max(0, stk.qty - (ing.qty * item.qty));
                                await db.stocks.update(stk.id, { qty: newQty });
                            }
                        }
                    }
                }

                const itemsData = cart.map(c => ({
                    menuId: c.id,
                    name: c.name,
                    price: c.price,
                    qty: c.qty,
                    hpp: getMenuCOGS(c.ingredients)
                }));

                const txTotal = itemsData.reduce((a, b) => a + (b.price * b.qty), 0);
                const txHppTotal = itemsData.reduce((a, b) => a + (b.hpp * b.qty), 0);

                const newTx = {
                    id: 'TRX-' + Date.now().toString().slice(-6),
                    createdAt: new Date().toISOString(),
                    items: itemsData,
                    total: txTotal,
                    hppTotal: txHppTotal,
                    profit: txTotal - txHppTotal
                };

                await db.txs.add(newTx);
                setReceiptModal(newTx);
                setCart([]);
                setCheckoutModal(false);
                await loadData();
            };

            const handleSaveOpex = async () => {
                if (!formOpex.amount || isNaN(formOpex.amount)) return alert("Isi nominal pengeluaran!");
                await db.opex.add({
                    id: 'OPX-' + Date.now(),
                    createdAt: new Date().toISOString(),
                    category: formOpex.category,
                    amount: parseFloat(formOpex.amount),
                    note: formOpex.note || '-'
                });
                setFormOpex({ category: 'Listrik', amount: '', note: '' });
                setOpexModal(false);
                await loadData();
            };

            const handleSaveWaste = async () => {
                if (!formWaste.stockId || !formWaste.qty) return alert("Pilih bahan dan jumlah!");
                const stk = stocks.find(s => s.id === formWaste.stockId);
                if (!stk) return;

                const wasteQty = parseFloat(formWaste.qty);
                if (wasteQty > stk.qty) return alert("Jumlah melebihi sisa persediaan stok!");

                const lossCost = wasteQty * stk.price;
                await db.stocks.update(stk.id, { qty: stk.qty - wasteQty });
                await db.waste.add({
                    id: 'WST-' + Date.now(),
                    createdAt: new Date().toISOString(),
                    stockId: stk.id,
                    stockName: stk.name,
                    qty: wasteQty,
                    unit: stk.unit,
                    estimatedLoss: lossCost,
                    note: formWaste.note || 'Rusak'
                });

                setFormWaste({ stockId: '', qty: '', note: '' });
                setWasteModal(false);
                await loadData();
            };

            const handleSaveBahan = async () => {
                if (!formBahan.name || !formBahan.price || !formBahan.qty) return alert("Isi lengkap data persediaan!");
                await db.stocks.add({
                    id: 'stk-' + Date.now(),
                    name: formBahan.name,
                    unit: formBahan.unit,
                    price: parseFloat(formBahan.price),
                    qty: parseFloat(formBahan.qty)
                });
                setFormBahan({ name: '', unit: 'kg', price: '', qty: '' });
                setBahanModal(false);
                await loadData();
            };

            const handleSaveMenu = async () => {
                if (!formMenu.name || !formMenu.price) return alert("Nama dan harga wajib diisi!");
                const validIng = formMenu.ingredients
                    .filter(i => i.stockId && i.qty)
                    .map(i => ({ stockId: i.stockId, qty: parseFloat(i.qty) }));

                if (editingMenu) {
                    await db.menus.update(editingMenu.id, {
                        name: formMenu.name,
                        category: formMenu.category,
                        price: parseFloat(formMenu.price),
                        icon: formMenu.icon || '🍽️',
                        ingredients: validIng
                    });
                } else {
                    await db.menus.add({
                        id: 'm-' + Date.now(),
                        name: formMenu.name,
                        category: formMenu.category,
                        price: parseFloat(formMenu.price),
                        icon: formMenu.icon || '🍽️',
                        ingredients: validIng
                    });
                }

                setEditingMenu(null);
                setFormMenu({ name: '', category: 'Makanan', price: '', icon: '🍽️', ingredients: [{ stockId: '', qty: '' }] });
                setMenuModal(false);
                await loadData();
            };

            const handleDeleteMenu = async (id) => {
                if (confirm("Hapus menu ini?")) {
                    await db.menus.delete(id);
                    await loadData();
                }
            };

            const handleDeleteStock = async (id) => {
                if (confirm("Hapus bahan baku dari Gudang?")) {
                    await db.stocks.delete(id);
                    await loadData();
                }
            };

            if (loading) {
                return <div className="p-8 text-center text-slate-500 font-bold bg-white min-h-screen flex items-center justify-center">Memuat Sistem Kasir & Inventory Storage...</div>;
            }

            return (
                <div className="app-container border-x border-slate-200 shadow-2xl">
                    {/* TOP HEADER */}
                    <header className="p-4 bg-white border-b border-slate-100 sticky top-0 z-20 flex justify-between items-center">
                        <div>
                            <h1 className="text-xl font-extrabold text-slate-800 tracking-tight">KasirKu Master</h1>
                            <p className="text-[11px] font-bold text-emerald-600 flex items-center gap-1">
                                <span className="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
                                Inventory Storage Connected
                            </p>
                        </div>
                        {cart.length > 0 && tab === 'kasir' && (
                            <div className="bg-blue-600 text-white font-extrabold text-xs px-3 py-1.5 rounded-full shadow-sm">
                                {cart.reduce((a, b) => a + b.qty, 0)} Item
                            </div>
                        )}
                    </header>

                    {/* GLOBAL DATE FILTER BAR */}
                    {(tab === 'laporan' || tab === 'riwayat') && (
                        <div className="p-3 bg-slate-100 border-b border-slate-200 sticky top-[65px] z-10 flex items-center gap-2 overflow-x-auto no-scrollbar w-full">
                            <span className="text-xs font-extrabold text-slate-500 shrink-0">Filter:</span>
                            {[
                                { id: 'hariIni', label: 'Hari Ini' },
                                { id: 'bulanIni', label: 'Bulan Ini' },
                                { id: 'semua', label: 'Semua Data' }
                            ].map(p => (
                                <button
                                    key={p.id}
                                    onClick={() => setDatePreset(p.id)}
                                    className={`px-3 py-1.5 text-xs font-extrabold rounded-xl whitespace-nowrap shrink-0 transition-all ${
                                        datePreset === p.id 
                                        ? 'bg-blue-600 text-white shadow-xs' 
                                        : 'bg-white text-slate-600 border border-slate-200'
                                    }`}
                                >
                                    {p.label}
                                </button>
                            ))}
                        </div>
                    )}

                    {/* MAIN CONTENT */}
                    <main className="flex-1 p-4 pb-28 overflow-y-auto w-full">
                        {/* 1. TAB KASIR */}
                        {tab === 'kasir' && (
                            <div className="w-full">
                                <div className="flex gap-2 mb-4 overflow-x-auto no-scrollbar">
                                    {['Makanan', 'Minuman', 'Dessert'].map(cat => (
                                        <button
                                            key={cat}
                                            onClick={() => setKasirCat(cat)}
                                            className={`px-4 py-2 text-xs font-extrabold rounded-xl shrink-0 transition-all ${
                                                kasirCat === cat 
                                                ? 'bg-blue-600 text-white shadow-md' 
                                                : 'bg-white text-slate-600 border border-slate-200'
                                            }`}
                                        >
                                            {cat}
                                        </button>
                                    ))}
                                </div>

                                <div className="grid grid-cols-2 gap-3 mb-6 w-full">
                                    {menus.filter(m => m.category === kasirCat).map(m => {
                                        const cogs = getMenuCOGS(m.ingredients);
                                        return (
                                            <div 
                                                key={m.id}
                                                onClick={() => addToCart(m)}
                                                className="p-3.5 bg-white border border-slate-200 rounded-2xl shadow-xs active:scale-95 transition-all cursor-pointer flex flex-col justify-between"
                                            >
                                                <div>
                                                    <div className="flex justify-between items-start">
                                                        <div className="text-3xl mb-1">{m.icon || '🍽️'}</div>
                                                        <span className="text-[10px] font-extrabold bg-amber-50 text-amber-700 px-2 py-0.5 rounded-md border border-amber-200">
                                                            HPP: Rp {cogs.toLocaleString('id-ID')}
                                                        </span>
                                                    </div>
                                                    <div className="font-extrabold text-slate-800 text-sm leading-snug mt-1">{m.name}</div>
                                                    <div className="text-blue-600 font-black text-sm mt-0.5">
                                                        Rp {m.price.toLocaleString('id-ID')}
                                                    </div>
                                                </div>

                                                {/* Resep Terikat dengan Inventory */}
                                                <div className="mt-3 pt-2 border-t border-slate-100 text-[10px] text-slate-400 font-semibold space-y-0.5">
                                                    <div className="font-bold text-slate-500">Resep Gudang:</div>
                                                    {m.ingredients && m.ingredients.length > 0 ? (
                                                        m.ingredients.map((ing, idx) => {
                                                            const stk = stocks.find(s => s.id === ing.stockId);
                                                            return (
                                                                <div key={idx} className="truncate text-slate-600">
                                                                    • {stk ? stk.name : 'Unknown'}: <span className="font-bold">{ing.qty} {stk?.unit}</span>
                                                                </div>
                                                            );
                                                        })
                                                    ) : (
                                                        <div className="italic text-slate-300">Belum ada resep terikat</div>
                                                    )}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>

                                {cart.length > 0 && (
                                    <div className="p-4 bg-white border border-slate-200 rounded-2xl shadow-md space-y-3 w-full">
                                        <div className="font-extrabold text-xs text-slate-400 uppercase tracking-wider">Detail Keranjang</div>
                                        {cart.map(c => (
                                            <div key={c.id} className="flex justify-between items-center text-xs py-1 border-b border-slate-100">
                                                <div>
                                                    <div className="font-bold text-slate-800">{c.name}</div>
                                                    <div className="text-slate-400">Rp {(c.price * c.qty).toLocaleString('id-ID')}</div>
                                                </div>
                                                <div className="flex items-center gap-2">
                                                    <button onClick={() => updateCartQty(c.id, -1)} className="w-6 h-6 bg-slate-100 font-black rounded-lg text-slate-600 flex items-center justify-center">-</button>
                                                    <span className="font-extrabold text-xs w-4 text-center">{c.qty}</span>
                                                    <button onClick={() => updateCartQty(c.id, 1)} className="w-6 h-6 bg-slate-100 font-black rounded-lg text-slate-600 flex items-center justify-center">+</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* 2. TAB GUDANG (INVENTORY STORAGE DETAILED) */}
                        {tab === 'gudang' && (
                            <div className="space-y-4 w-full">
                                <div className="grid grid-cols-2 gap-2">
                                    <button 
                                        onClick={() => setOpexModal(true)}
                                        className="py-3 bg-amber-500 text-white font-extrabold text-xs rounded-2xl shadow-xs active:scale-95 transition-all flex items-center justify-center gap-1"
                                    >
                                        💸 Catat OPEX
                                    </button>
                                    <button 
                                        onClick={() => setWasteModal(true)}
                                        className="py-3 bg-red-500 text-white font-extrabold text-xs rounded-2xl shadow-xs active:scale-95 transition-all flex items-center justify-center gap-1"
                                    >
                                        🗑️ Catat Waste
                                    </button>
                                </div>

                                {/* Ringkasan Nilai Persediaan Inventory */}
                                <div className="p-4 bg-slate-900 text-white rounded-3xl space-y-2 shadow-md">
                                    <div className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Ringkasan Persediaan Gudang</div>
                                    <div className="flex justify-between items-baseline">
                                        <div className="text-2xl font-black text-emerald-400">
                                            Rp {totalStockValue.toLocaleString('id-ID')}
                                        </div>
                                        <div className="text-xs font-bold text-slate-300">
                                            {stocks.length} Jenis Bahan
                                        </div>
                                    </div>
                                    <div className="text-[11px] text-slate-400 border-t border-slate-800 pt-2 flex justify-between">
                                        <span>Status Stok Kritis (&le; 2 unit):</span>
                                        <span className="font-extrabold text-amber-400">
                                            {stocks.filter(s => s.qty <= 2).length} Item
                                        </span>
                                    </div>
                                </div>

                                {/* Detail Sisa Persediaan Inventory */}
                                <div className="bg-white p-4 border border-slate-200 rounded-2xl shadow-xs space-y-3">
                                    <div className="flex justify-between items-center">
                                        <div>
                                            <h3 className="font-extrabold text-slate-800 text-sm">📦 Sisa Persediaan Inventory Storage</h3>
                                            <p className="text-[11px] text-slate-400">Real-time update terpotong otomatis saat transaksi kasir.</p>
                                        </div>
                                        <button 
                                            onClick={() => setBahanModal(true)}
                                            className="px-2.5 py-1 bg-blue-50 text-blue-600 font-extrabold text-xs rounded-xl hover:bg-blue-100"
                                        >
                                            + Bahan
                                        </button>
                                    </div>

                                    <div className="space-y-2.5">
                                        {stocks.map(s => {
                                            const totalItemVal = s.qty * s.price;
                                            let statusColor = "bg-emerald-100 text-emerald-700";
                                            let statusLabel = "Aman";
                                            if (s.qty <= 0) {
                                                statusColor = "bg-red-100 text-red-700 font-black animate-pulse";
                                                statusLabel = "Habis!";
                                            } else if (s.qty <= 2) {
                                                statusColor = "bg-amber-100 text-amber-700";
                                                statusLabel = "Menipis";
                                            }

                                <div className="flex gap-2 pt-2">
                                    <button onClick={() => setMenuModal(false)} className="flex-1 py-2.5 border font-bold text-slate-600 text-xs rounded-xl">Batal</button>
                                    <button onClick={handleSaveMenu} className="flex-1 py-2.5 bg-blue-600 text-white font-bold text-xs rounded-xl">Simpan Menu</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* BOTTOM NAVIGATION */}
                    <nav className="fixed bottom-0 left-0 right-0 max-w-[480px] mx-auto bg-white border-t border-slate-200 flex justify-around py-2 z-20 shadow-lg">
                        {[
                            { id: 'kasir', label: 'Kasir', icon: '🛒' },
                            { id: 'gudang', label: 'Gudang', icon: '📦' },
                            { id: 'laporan', label: 'Laporan', icon: '📊' },
                            { id: 'riwayat', label: 'Riwayat', icon: '📜' },
                            { id: 'pengaturan', label: 'Atur', icon: '⚙️' }
                        ].map(t => (
                            <button 
                                key={t.id} 
                                onClick={() => setTab(t.id)} 
                                className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${tab === t.id ? 'text-blue-600' : 'text-slate-400'}`}
                            >
                                <span className="text-base leading-none">{t.icon}</span>
                                {t.label}
                            </button>
                        ))}
                    </nav>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
